e1_lr_base: "Hipótesis confirmada a medias: con umbral 0,5 detecta el 97,7 % de los ataques, pero con una FPR de 17,9 %. Para cumplir FPR <= 0,05 necesita umbral 0,78 y el recall cae a 75,6 %."
e2_lr_log_balanced: "Hipótesis no confirmada con umbral 0,5: frente a E1 el recall baja de 97,7 % a 95,3 % (falsos negativos de 231 a 468), aunque la FPR baja de 17,9 % a 14,0 %. Con FPR <= 0,05 sí mejora el recall (80,1 % frente a 75,6 %), pero log1p y class_weight cambian a la vez, así que no se pueden separar sus efectos."
e3_rf: "Hipótesis confirmada solo a FPR comparable: con umbral 0,5 los falsos negativos no bajan frente a E2 (474 frente a 468), aunque la FPR cae a 8,8 %. Con FPR <= 0,05 los falsos negativos sí se reducen frente a E2, de 1.976 a 1.018 (recall 89,7 %)."
e4_hgb: "Hipótesis confirmada en validación: con FPR <= 0,05 alcanza recall 90,4 % frente a 89,7 % del RF, con inferencia de 0,38 s frente a 0,56 s en 20.163 filas (una medición, un hilo) y un modelo de 1,1 MB frente a 104,9 MB. Es la v2 elegida, con umbral 0,64."
